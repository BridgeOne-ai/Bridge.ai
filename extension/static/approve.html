<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bridge.ai: parent approval</title>
  <style>
    :root { --bg: #fff; --text: #1f1f1f; --muted: #5f6368; --line: #dadce0; --field: #f1f3f4;
      --accent: #0b57d0; --on-accent: #fff; --error: #b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #202124; --text: #e8eaed; --muted: #9aa0a6; --line: #3c4043; --field: #2c2d30;
        --accent: #a8c7fa; --on-accent: #062e6f; --error: #f2b8b5; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); font-size: 12.5px; }
    .what { padding: 12px; border-radius: 10px; background: var(--field); overflow-wrap: anywhere; }
    label { display: block; margin: 16px 0 6px; font-weight: 500; }
    input { width: 100%; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg);
      color: var(--text); font: inherit; letter-spacing: .2em; }
    .error { color: var(--error); min-height: 1.4em; margin: 8px 0 0; font-size: 13px; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    button { flex: 1; height: 38px; border-radius: 19px; border: 1px solid var(--line); background: none; color: var(--text);
      font: 500 14px system-ui, -apple-system, sans-serif; cursor: pointer; }
    button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>A parent needs to approve this</h1>
  <p class="what" id="what"></p>
  <form id="form">
    <label for="pin">Parent PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" />
    <p class="error" id="error" role="alert"></p>
    <div class="actions">
      <button type="button" id="deny">Don't send</button>
      <button type="submit" class="primary" id="approve">Send it</button>
    </div>
  </form>
  <p class="muted">Only the kind of information is shown here, never the message. This window belongs to Bridge.ai, so the chat site can't see the PIN.</p>
  <script src="approve.js"></script>
</body>
</html>
